name: Deploy app and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'customer-app/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-app/package-lock.json
      - name: Install dependencies
        working-directory: customer-app
        run: npm ci
      - name: Build app (served from /<repo>/ on Pages)
        working-directory: customer-app
        run: npm run build -- --base "/${GITHUB_REPOSITORY#*/}/"
      - name: Assemble site — app at root, docs under /docs
        run: |
          mkdir site
          cp -r customer-app/dist/. site/
          # SPA fallback so deep links like /edit/3 load the app
          cp site/index.html site/404.html
          mkdir site/docs
          cp -r customer-app/docs/. site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  update-readme-link:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync Pages URLs into README
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          sed -i "s|<!-- pages-url -->.*<!-- /pages-url -->|<!-- pages-url -->${PAGE_URL}<!-- /pages-url -->|" README.md
          sed -i "s|<!-- docs-url -->.*<!-- /docs-url -->|<!-- docs-url -->${PAGE_URL}docs/<!-- /docs-url -->|" README.md
          if git diff --quiet README.md; then
            echo "README already has the current Pages URLs"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync GitHub Pages links in README" README.md
            git push origin main
          fi
