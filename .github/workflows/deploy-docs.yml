name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'customer-app/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: customer-app/docs
      - id: deployment
        uses: actions/deploy-pages@v4

  update-readme-link:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync Pages URL into README
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          sed -i "s|<!-- pages-url -->.*<!-- /pages-url -->|<!-- pages-url -->${PAGE_URL}<!-- /pages-url -->|" README.md
          if git diff --quiet README.md; then
            echo "README already has the current Pages URL"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync GitHub Pages link in README" README.md
            git push origin main
          fi
